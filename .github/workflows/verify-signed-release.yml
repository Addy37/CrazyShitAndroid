name: Verify Signed Release

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-signed-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Restore private release signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, sys
          raw = os.environ.get("SIGNING_BUNDLE", "")
          if not raw:
              sys.exit("Missing repository secret: ANDROID_SIGNING_BUNDLE")
          raw = raw.replace("\r", "").replace("\n", "")
          data = json.loads(raw)
          required = ["keystore_base64", "store_password", "key_alias", "key_password"]
          missing = [key for key in required if not data.get(key)]
          if missing:
              sys.exit("Signing bundle is missing: " + ", ".join(missing))
          keystore = pathlib.Path(os.environ["RUNNER_TEMP"]) / "crazyshit-unofficial-release.jks"
          keystore.write_bytes(base64.b64decode(data["keystore_base64"]))
          keystore.chmod(0o600)
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as f:
              f.write(f"ANDROID_KEYSTORE_PATH={keystore}\n")
              f.write(f"ANDROID_KEYSTORE_PASSWORD={data['store_password']}\n")
              f.write(f"ANDROID_KEY_ALIAS={data['key_alias']}\n")
              f.write(f"ANDROID_KEY_PASSWORD={data['key_password']}\n")
          PY

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK signature
        run: apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
