name: Bunkr App Pipeline Probe

on:
  push:
    branches: [ fix/bunkr-integration ]
    paths:
      - ".github/workflows/bunkr-app-probe.yml"
      - "app/src/test/java/com/webapp/crazyshit/BunkrLiveProbeTest.java"

permissions:
  contents: read

jobs:
  app-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
          cache-provider: basic
      - name: Run the app's Bunkr pipeline against live responses
        run: gradle --no-daemon :app:testDebugUnitTest --tests com.webapp.crazyshit.BunkrLiveProbeTest --info
