name: Publish Signed APK Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix
        required: true
        default: '1.0.0'
        type: string
  push:
    paths:
      - RELEASE_VERSION

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Resolve release version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(tr -d '[:space:]' < RELEASE_VERSION)"
          fi
          test -n "$VERSION" || { echo "Release version is empty"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_NAME=$VERSION" >> "$GITHUB_ENV"
          echo "APP_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Restore private release signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          python - <<'PY'
          import base64, json, os, pathlib, sys

          raw = os.environ.get("SIGNING_BUNDLE", "")
          if not raw:
              sys.exit("Missing repository secret: ANDROID_SIGNING_BUNDLE")

          raw = raw.replace("\r", "").replace("\n", "")
          data = json.loads(raw)
          required = ["keystore_base64", "store_password", "key_alias", "key_password"]
          missing = [key for key in required if not data.get(key)]
          if missing:
              sys.exit("Signing bundle is missing: " + ", ".join(missing))

          keystore = pathlib.Path(os.environ["RUNNER_TEMP"]) / "crazyshit-unofficial-release.jks"
          keystore.write_bytes(base64.b64decode(data["keystore_base64"]))
          keystore.chmod(0o600)

          env_file = pathlib.Path(os.environ["GITHUB_ENV"])
          with env_file.open("a", encoding="utf-8") as f:
              f.write(f"ANDROID_KEYSTORE_PATH={keystore}\n")
              f.write(f"ANDROID_KEYSTORE_PASSWORD={data['store_password']}\n")
              f.write(f"ANDROID_KEY_ALIAS={data['key_alias']}\n")
              f.write(f"ANDROID_KEY_PASSWORD={data['key_password']}\n")
          PY

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare and verify release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk CrazyShit-Unofficial.apk
          cp CrazyShit-Unofficial.apk "CrazyShit-Unofficial-v${VERSION}.apk"
          apksigner verify --verbose --print-certs CrazyShit-Unofficial.apk
          sha256sum CrazyShit-Unofficial.apk > SHA256SUMS.txt
          sha256sum "CrazyShit-Unofficial-v${VERSION}.apk" >> SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" \
            CrazyShit-Unofficial.apk \
            "CrazyShit-Unofficial-v${VERSION}.apk" \
            SHA256SUMS.txt \
            --target "$GITHUB_SHA" \
            --title "CrazyShit Unofficial v${VERSION}" \
            --notes-file RELEASE_NOTES.md \
            --latest
