name: Apply v1.4.3 System Bar Insets

on:
  push:
    branches: [ v1.4.3-system-bars ]
    paths:
      - V1_4_3_INSETS_TRIGGER

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4.3-system-bars

      - name: Apply browser system-bar insets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/webapp/crazyshit/MainActivity.java')
          s = p.read_text()
          old = '''        webFrame = new FrameLayout(this);\n        root.addView(webFrame, match());\n'''
          new = '''        webFrame = new FrameLayout(this);\n        webFrame.setOnApplyWindowInsetsListener((view, insets) -> {\n            int left;\n            int top;\n            int right;\n            int bottom;\n            if (Build.VERSION.SDK_INT >= 30) {\n                android.graphics.Insets safe = insets.getInsets(\n                        WindowInsets.Type.systemBars() | WindowInsets.Type.displayCutout()\n                );\n                left = safe.left;\n                top = safe.top;\n                right = safe.right;\n                bottom = safe.bottom;\n            } else {\n                left = insets.getSystemWindowInsetLeft();\n                top = insets.getSystemWindowInsetTop();\n                right = insets.getSystemWindowInsetRight();\n                bottom = insets.getSystemWindowInsetBottom();\n            }\n            view.setPadding(left, top, right, bottom);\n            return insets;\n        });\n        root.addView(webFrame, match());\n'''
          if old not in s:
              raise SystemExit('Expected MainActivity browser-frame block not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name "Addy37"
          git config user.email "92006667+Addy37@users.noreply.github.com"
          git add app/src/main/java/com/webapp/crazyshit/MainActivity.java
          git commit -m "Respect Android system bars in browser UI" || exit 0
          git push origin HEAD:v1.4.3-system-bars
