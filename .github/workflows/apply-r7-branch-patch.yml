name: Temporary v2 beta wiring

on:
  push:
    branches: [ main ]
    paths: [ '.r7-main-patch-trigger' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v2-native-app
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Wire updater login and richer comments
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/webapp/crazyshit/NativeMainActivity.java')
          s = p.read_text()
          s = s.replace('    private NativeMiniPlayer miniPlayer;\n', '    private NativeMiniPlayer miniPlayer;\n    private AppUpdater appUpdater;\n', 1)
          s = s.replace('        buildUi();\n        configureBack();', '        buildUi();\n        appUpdater = new AppUpdater(this);\n        configureBack();', 1)
          s = s.replace('''        addSheetAction(content, "Login / account", "Open the website account flow", () -> {
            openFallback(CrazyShitRepository.BASE + "login/");
            sheet.dismiss();
        });''','''        addSheetAction(content, "Login / account", "Sign in here and return automatically", () -> {
            startActivity(new Intent(this, LoginActivity.class));
            sheet.dismiss();
        });''',1)
          s = s.replace('''        addSheetAction(content, "Check for updates", "Check the latest GitHub release", () -> {
            checkForUpdates(true);
            sheet.dismiss();
        });''','''        addSheetAction(content, "Check for updates", "Download and install updates inside the app", () -> {
            checkForUpdates(true);
            sheet.dismiss();
        });''',1)
          start = s.index('    private void checkForUpdates(boolean manual) {')
          end = s.index('    private String currentVersion()', start)
          s = s[:start] + '''    private void checkForUpdates(boolean manual) {
        if (appUpdater != null) appUpdater.check(manual);
    }

''' + s[end:]
          s = s.replace('''    protected void onResume() {
        super.onResume();
        if (miniPlayer != null) miniPlayer.onResume();
    }''','''    protected void onResume() {
        super.onResume();
        if (miniPlayer != null) miniPlayer.onResume();
        if (appUpdater != null) appUpdater.onHostResume();
    }''',1)
          s = s.replace('''    protected void onDestroy() {
        if (miniPlayer != null) miniPlayer.stop();
        io.shutdownNow();
        super.onDestroy();
    }''','''    protected void onDestroy() {
        if (miniPlayer != null) miniPlayer.stop();
        if (appUpdater != null) appUpdater.close();
        io.shutdownNow();
        super.onDestroy();
    }''',1)
          p.write_text(s)

          p = Path('app/src/main/java/com/webapp/crazyshit/CommentsActivity.java')
          s = p.read_text()
          if 'import android.graphics.drawable.ColorDrawable;' not in s:
              s = s.replace('import android.graphics.Color;\n', 'import android.graphics.Color;\nimport android.graphics.drawable.ColorDrawable;\n', 1)
          if 'import android.widget.ImageView;' not in s:
              s = s.replace('import android.widget.FrameLayout;\n', 'import android.widget.FrameLayout;\nimport android.widget.ImageView;\n', 1)
          if 'import android.widget.Toast;' not in s:
              s = s.replace('import android.widget.TextView;\n', 'import android.widget.TextView;\nimport android.widget.Toast;\n', 1)
          if 'import com.bumptech.glide.Glide;' not in s:
              s = s.replace('import com.google.android.material.card.MaterialCardView;\n', 'import com.bumptech.glide.Glide;\nimport com.google.android.material.card.MaterialCardView;\n', 1)
          s = s.replace('    public static final String EXTRA_COUNT = "count";\n', '    public static final String EXTRA_COUNT = "count";\n    private static final int LOGIN_REQUEST = 4201;\n', 1)

          start = s.index('    private static final String COMMENTS_JS =')
          end = s.index('\n\n    private String pageUrl;', start)
          block = r'''    private static final String COMMENTS_JS =
            "(() => {" +
            "const clean=s=>(s||'').replace(/\\s+/g,' ').trim();" +
            "const pageText=clean(document.body?document.body.innerText:'');" +
            "const loginRequired=/please\\s+(?:log\\s*in|login)\\s+to\\s+view\\s+all\\s+comments/i.test(pageText);" +
            "const sig=e=>((e&&e.id)||'')+' '+((e&&typeof e.className==='string')?e.className:'');" +
            "const commentish=e=>{if(!e)return false;if(e.hasAttribute&&e.hasAttribute('data-comment-id'))return true;let s=sig(e).toLowerCase();return /(?:^|[\\s_-])comment(?:[\\s_-]|$)/.test(s)||/commentitem|comment-item|comment_row|comment-row|media-comment/.test(s);};" +
            "const bodySelectors=['[itemprop=commentText]','.comment-text','.comment_text','.comment-body','.comment_body','.comment-content','.comment_content','[class*=commentText]','[class*=comment-text]','[class*=comment_body]','[class*=comment-body]','.message','[class*=message]'];" +
            "const authorSelectors=['.username','.user-name','.user_name','.author','.comment-author','[class*=username]','[class*=author]','a[href*=user]','a[href*=member]','a[href*=profile]'];" +
            "const timeSelectors=['time','.date','.time','.comment-date','.comment-time','[class*=date]','[class*=time]'];" +
            "const avatarSelectors=['img.avatar','img[class*=avatar]','img[class*=user]','img[class*=profile]'];" +
            "const scoreSelectors=['.score','.votes','.vote-count','.vote_count','[class*=score]','[class*=vote-count]','[class*=votes]'];" +
            "let roots=[...document.querySelectorAll('div,li,article,section')].filter(commentish);if(!roots.length){roots=[...document.querySelectorAll('[data-comment-id],[id^=comment-],[id^=comment_]')];}" +
            "const out=[];const seen=new Set();" +
            "for(const e of roots){if(!e||!e.isConnected)continue;let explicit=null;for(const q of bodySelectors){let x=e.matches&&e.matches(q)?e:e.querySelector(q);if(x){explicit=x;break;}}if(!explicit){let nested=[...e.querySelectorAll('div,li,article,section')].filter(x=>x!==e&&commentish(x));if(nested.length)continue;}let body=explicit||e;let text=clean(body.innerText||body.textContent);if(text.length<5||text.length>2600)continue;if(/^(?:top|bottom|newest|oldest|best|worst|comments?)$/i.test(text))continue;if(/^[+\\-]?\\d+(?:\\s+[+\\-]?\\d+)*$/.test(text))continue;if(/please\\s+(?:log\\s*in|login)\\s+to\\s+view\\s+all\\s+comments/i.test(text))continue;" +
            "let a=null;for(const q of authorSelectors){a=e.querySelector(q);if(a)break;}let tm=null;for(const q of timeSelectors){tm=e.querySelector(q);if(tm)break;}let av=null;for(const q of avatarSelectors){av=e.querySelector(q);if(av)break;}let sc=null;for(const q of scoreSelectors){sc=e.querySelector(q);if(sc)break;}let author=clean(a&&(a.innerText||a.textContent));let time=clean(tm&&(tm.innerText||tm.textContent));let score=clean(sc&&(sc.innerText||sc.textContent));let avatar='';if(av){let raw=av.currentSrc||av.src||av.getAttribute('data-src')||'';try{avatar=raw?new URL(raw,document.baseURI).href:''}catch(err){avatar='';}}" +
            "if(body===e){if(author&&text.toLowerCase().startsWith(author.toLowerCase()))text=clean(text.slice(author.length));if(time&&text.toLowerCase().startsWith(time.toLowerCase()))text=clean(text.slice(time.length));}text=text.replace(/^(?:reply|report|like|dislike)\\s+/i,'').trim();if(text.length<5)continue;let depth=0,p=e.parentElement;while(p&&p!==document.body&&depth<3){if(commentish(p))depth++;p=p.parentElement;}let key=(author+'|'+text).toLowerCase();if(seen.has(key))continue;seen.add(key);out.push({author:author,time:time,text:text,avatar:avatar,score:score,depth:depth});if(out.length>=100)break;}" +
            "return JSON.stringify({loginRequired:loginRequired,comments:out});" +
            "})()";'''
          s = s[:start] + block + s[end:]

          old = '''            String author = clean(item.optString("author"));
            String time = clean(item.optString("time"));
            String text = clean(item.optString("text"));
            if (!isRealCommentText(text)) continue;
            String key = (author + "|" + text).toLowerCase();
            if (!rendered.add(key)) continue;
            commentsContainer.addView(commentCard(author, time, text), cardParams());'''
          new = '''            String author = clean(item.optString("author"));
            String time = clean(item.optString("time"));
            String text = clean(item.optString("text"));
            String avatar = clean(item.optString("avatar"));
            String score = clean(item.optString("score"));
            int depth = Math.max(0, Math.min(3, item.optInt("depth", 0)));
            if (!isRealCommentText(text)) continue;
            String key = (author + "|" + text).toLowerCase();
            if (!rendered.add(key)) continue;
            commentsContainer.addView(commentCard(author, time, text, avatar, score), commentCardParams(depth));'''
          s = s.replace(old, new, 1)

          start = s.index('    private View commentCard(String author, String time, String text) {')
          end = s.index('    private LinearLayout.LayoutParams cardParams()', start)
          s = s[:start] + '''    private View commentCard(String author, String time, String text, String avatarUrl, String score) {
        MaterialCardView card = new MaterialCardView(this);
        card.setCardBackgroundColor(Color.rgb(25, 25, 28));
        card.setStrokeColor(Color.rgb(48, 48, 54));
        card.setStrokeWidth(dp(1));
        card.setRadius(dp(15));
        LinearLayout body = new LinearLayout(this);
        body.setOrientation(LinearLayout.VERTICAL);
        body.setPadding(dp(14), dp(12), dp(14), dp(13));
        card.addView(body, new MaterialCardView.LayoutParams(-1, -2));
        LinearLayout meta = new LinearLayout(this);
        meta.setOrientation(LinearLayout.HORIZONTAL);
        meta.setGravity(Gravity.CENTER_VERTICAL);
        body.addView(meta, new LinearLayout.LayoutParams(-1, -2));
        if (!avatarUrl.isEmpty()) {
            ImageView avatar = new ImageView(this);
            avatar.setScaleType(ImageView.ScaleType.CENTER_CROP);
            LinearLayout.LayoutParams ap = new LinearLayout.LayoutParams(dp(30), dp(30));
            ap.setMargins(0, 0, dp(9), 0);
            meta.addView(avatar, ap);
            Glide.with(avatar).load(avatarUrl).circleCrop().placeholder(new ColorDrawable(Color.rgb(45,45,50))).error(new ColorDrawable(Color.rgb(45,45,50))).into(avatar);
        }
        LinearLayout identity = new LinearLayout(this);
        identity.setOrientation(LinearLayout.VERTICAL);
        meta.addView(identity, new LinearLayout.LayoutParams(0, -2, 1f));
        TextView name = new TextView(this);
        name.setText(author.isEmpty() ? "Comment" : author);
        name.setTextColor(Color.rgb(255,112,60));
        name.setTextSize(13);
        name.setTypeface(null, android.graphics.Typeface.BOLD);
        identity.addView(name);
        if (!time.isEmpty()) {
            TextView when = new TextView(this);
            when.setText(time);
            when.setTextColor(Color.rgb(145,145,154));
            when.setTextSize(11);
            identity.addView(when);
        }
        if (!score.isEmpty() && score.length() < 30) {
            TextView votes = new TextView(this);
            votes.setText("▲ " + score);
            votes.setTextColor(Color.rgb(170,170,180));
            votes.setTextSize(11);
            votes.setPadding(dp(8),0,0,0);
            meta.addView(votes, new LinearLayout.LayoutParams(-2,-2));
        }
        TextView copy = new TextView(this);
        copy.setText(text);
        copy.setTextColor(Color.rgb(235,235,238));
        copy.setTextSize(14);
        copy.setLineSpacing(0f,1.08f);
        copy.setPadding(0,dp(8),0,0);
        body.addView(copy,new LinearLayout.LayoutParams(-1,-2));
        return card;
    }

''' + s[end:]
          anchor = '    private TextView messageView(String message, boolean clickable) {'
          s = s.replace(anchor, '''    private LinearLayout.LayoutParams commentCardParams(int depth) {
        LinearLayout.LayoutParams params = new LinearLayout.LayoutParams(-1, -2);
        params.setMargins(dp(Math.min(3, depth) * 16), 0, 0, dp(9));
        return params;
    }

''' + anchor, 1)
          s = s.replace('''    private void openLogin() {
        refreshWhenResumed = true;
        Intent intent = new Intent(this, WebFallbackActivity.class);
        intent.putExtra(WebFallbackActivity.EXTRA_URL, CrazyShitRepository.BASE + "login/");
        startActivity(intent);
    }''','''    private void openLogin() {
        Intent intent = new Intent(this, LoginActivity.class);
        intent.putExtra(LoginActivity.EXTRA_RETURN_URL, pageUrl);
        startActivityForResult(intent, LOGIN_REQUEST);
    }''',1)
          anchor = '''    @Override
    protected void onResume() {'''
          s = s.replace(anchor, '''    @Override
    protected void onActivityResult(int requestCode, int resultCode, Intent data) {
        super.onActivityResult(requestCode, resultCode, data);
        if (requestCode == LOGIN_REQUEST && resultCode == RESULT_OK) {
            try { CookieManager.getInstance().flush(); } catch (Exception ignored) {}
            Toast.makeText(this, "Signed in. Loading all comments…", Toast.LENGTH_SHORT).show();
            if (extractor != null) extractor.postDelayed(this::loadComments, 180L);
        }
    }

''' + anchor, 1)
          p.write_text(s)
          PY

      - name: Commit to v2 branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/webapp/crazyshit/NativeMainActivity.java app/src/main/java/com/webapp/crazyshit/CommentsActivity.java
          git commit -m "Wire focused login updater and richer comments" || exit 0
          git push origin HEAD:v2-native-app
