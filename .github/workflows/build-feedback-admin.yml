name: Build Private Feedback Admin APK

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-feedback-admin.yml'
      - 'feedbackadmin/**'
      - 'supabase/functions/feedback-admin/**'
      - 'supabase/functions/app-config-admin/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/migrations/*source_config.sql'
      - 'supabase/migrations/*analytics.sql'
  workflow_dispatch:
  pull_request:
    paths:
      - 'feedbackadmin/**'
      - 'supabase/functions/feedback-admin/**'
      - 'supabase/functions/app-config-admin/**'
      - 'supabase/functions/_shared/**'
      - 'supabase/migrations/*source_config.sql'
      - 'supabase/migrations/*analytics.sql'
      - 'settings.gradle.kts'
      - '.github/workflows/build-feedback-admin.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ADMIN_SOURCE_CONFIG_ENDPOINT: https://fketutffusxgjxjlckci.supabase.co/functions/v1/app-config-admin
    steps:
      - uses: actions/checkout@v6

      - name: Apply admin UI refinement
        if: github.event_name == 'push'
        run: |
          python - <<'PY'
          from pathlib import Path

          main_path = Path('feedbackadmin/src/main/java/com/addy37/crazyshitadmin/MainActivity.java')
          analytics_path = Path('feedbackadmin/src/main/java/com/addy37/crazyshitadmin/AnalyticsActivity.java')
          gradle_path = Path('feedbackadmin/build.gradle.kts')

          main = main_path.read_text()
          main = main.replace(
              'content.addView(panel("FEEDBACK", "What users are telling you", feedbackBody));',
              'content.addView(panel("FEEDBACK", "New and total user submissions", feedbackBody));'
          )
          main = main.replace(
              'nav.setPadding(dp(8), dp(8), dp(8), dp(8));\n        nav.setBackgroundColor(color(R.color.app_surface));',
              'nav.setPadding(dp(6), dp(7), dp(6), dp(7));\n        nav.setBackgroundColor(color(R.color.app_surface));',
              1
          )
          old_main_nav = '''        button.setText(title);\n        button.setTextSize(11);\n        button.setAllCaps(false);\n        button.setMinHeight(dp(46));\n        button.setInsetTop(0);\n        button.setInsetBottom(0);\n        button.setCornerRadius(dp(14));'''
          new_main_nav = '''        button.setText(title);\n        button.setTextSize(10);\n        button.setAllCaps(false);\n        button.setSingleLine(true);\n        button.setMaxLines(1);\n        button.setMinWidth(0);\n        button.setPadding(dp(2), 0, dp(2), 0);\n        button.setMinHeight(dp(44));\n        button.setInsetTop(0);\n        button.setInsetBottom(0);\n        button.setCornerRadius(dp(13));'''
          if old_main_nav not in main and new_main_nav not in main:
              raise SystemExit('Main navigation block did not match expected source')
          main = main.replace(old_main_nav, new_main_nav, 1)
          main_path.write_text(main)

          analytics = analytics_path.read_text()
          analytics = analytics.replace(
              'nav.setPadding(dp(8), dp(8), dp(8), dp(8));\n        nav.setBackgroundColor(color(R.color.app_surface));',
              'nav.setPadding(dp(6), dp(7), dp(6), dp(7));\n        nav.setBackgroundColor(color(R.color.app_surface));',
              1
          )
          old_analytics_nav = '''        button.setText(title);\n        button.setTextSize(11);\n        button.setAllCaps(false);\n        button.setMinHeight(dp(46));\n        button.setInsetTop(0);\n        button.setInsetBottom(0);\n        button.setCornerRadius(dp(14));'''
          new_analytics_nav = '''        button.setText(title);\n        button.setTextSize(10);\n        button.setAllCaps(false);\n        button.setSingleLine(true);\n        button.setMaxLines(1);\n        button.setMinWidth(0);\n        button.setPadding(dp(2), 0, dp(2), 0);\n        button.setMinHeight(dp(44));\n        button.setInsetTop(0);\n        button.setInsetBottom(0);\n        button.setCornerRadius(dp(13));'''
          if old_analytics_nav not in analytics and new_analytics_nav not in analytics:
              raise SystemExit('Analytics navigation block did not match expected source')
          analytics = analytics.replace(old_analytics_nav, new_analytics_nav, 1)
          analytics_path.write_text(analytics)

          gradle = gradle_path.read_text()
          gradle = gradle.replace('versionCode = 3', 'versionCode = 4')
          gradle = gradle.replace('versionName = "1.2.0"', 'versionName = "1.2.1"')
          gradle_path.write_text(gradle)
          PY

          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add feedbackadmin/src/main/java/com/addy37/crazyshitadmin/MainActivity.java \
                    feedbackadmin/src/main/java/com/addy37/crazyshitadmin/AnalyticsActivity.java \
                    feedbackadmin/build.gradle.kts
            git commit -m "Refine admin dashboard navigation [skip ci]"
            git push
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      - name: Restore persistent signing key
        env:
          SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          if [ -z "$SIGNING_BUNDLE" ]; then
            echo "No signing bundle is available. Release will use the fallback debug key."
            exit 0
          fi
          python - <<'PY'
          import base64, json, os, pathlib
          raw = os.environ["SIGNING_BUNDLE"].replace("\r", "").replace("\n", "")
          data = json.loads(raw)
          required = ["keystore_base64", "store_password", "key_alias", "key_password"]
          missing = [key for key in required if not data.get(key)]
          if missing:
              raise SystemExit("Signing bundle is missing: " + ", ".join(missing))
          for key in ("store_password", "key_alias", "key_password"):
              print(f"::add-mask::{data[key]}")
          keystore = pathlib.Path(os.environ["RUNNER_TEMP"]) / "crazyshit-admin-release.jks"
          keystore.write_bytes(base64.b64decode(data["keystore_base64"]))
          keystore.chmod(0o600)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"ANDROID_KEYSTORE_PATH={keystore}\n")
              output.write(f"ANDROID_KEYSTORE_PASSWORD={data['store_password']}\n")
              output.write(f"ANDROID_KEY_ALIAS={data['key_alias']}\n")
              output.write(f"ANDROID_KEY_PASSWORD={data['key_password']}\n")
          PY

      - name: Build private admin APK
        run: gradle --no-daemon :feedbackadmin:assembleRelease

      - name: Prepare APK
        run: |
          cp feedbackadmin/build/outputs/apk/release/feedbackadmin-release.apk CrazyShit-Admin.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs CrazyShit-Admin.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-Admin
          path: CrazyShit-Admin.apk
          if-no-files-found: error
          retention-days: 14
