name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Verify 2.8 compatibility cleanup
        run: |
          set -euo pipefail
          if grep -R -n -E 'PAGE_TRENDING|PAGE_MEMES|NAV_TRENDING|NAV_MEMES|ChaosPortraitPolish|SeriesCategoriesNavController|VideoDetailControllerPolish|VideoDetailImmersivePolish' app/src/main/java; then
            echo "Obsolete 2.7 compatibility plumbing was reintroduced."
            exit 1
          fi
          grep -q 'NAV_SERIES = 2' app/src/main/java/com/webapp/crazyshit/NativeMainActivity.java
          grep -q 'NAV_CATEGORIES = 3' app/src/main/java/com/webapp/crazyshit/NativeMainActivity.java
          grep -q 'NativeContentItem.KIND_MEDIA.equals(item.kind)' app/src/main/java/com/webapp/crazyshit/ChaosFeedView.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Capture current Series and Categories artwork
        id: capture_art
        if: ${{ hashFiles('app/src/main/assets/browse_artwork.json') == '' }}
        run: |
          python3 -m pip install --quiet selenium pillow requests
          python3 tools/capture_browse_art.py
          mkdir -p app/src/main/assets
          python3 - <<'PY'
          import base64, io, json
          from PIL import Image, ImageOps

          with open('browse-art-bundle.json', 'r', encoding='utf-8') as f:
              bundle = json.load(f)

          mapping = {}
          for item in bundle.get('items', []):
              key = (item.get('key') or '').strip().lower()
              data = item.get('jpeg_base64') or ''
              if not key or not data:
                  continue
              raw = base64.b64decode(data)
              image = Image.open(io.BytesIO(raw)).convert('RGB')
              image = ImageOps.fit(image, (320, 180), method=Image.Resampling.LANCZOS, centering=(0.5, 0.45))
              out = io.BytesIO()
              image.save(out, 'JPEG', quality=68, optimize=True, progressive=True)
              mapping[key] = base64.b64encode(out.getvalue()).decode('ascii')

          with open('app/src/main/assets/browse_artwork.json', 'w', encoding='utf-8') as f:
              json.dump(mapping, f, separators=(',', ':'))
          print(f'Embedded {len(mapping)} browse card images')
          if len(mapping) < 75:
              raise SystemExit(f'Expected at least 75 embedded images, got {len(mapping)}')
          PY
          echo "captured=true" >> "$GITHUB_OUTPUT"

      - name: Save embedded artwork to branch
        if: ${{ steps.capture_art.outputs.captured == 'true' && github.event_name == 'pull_request' }}
        run: |
          cp app/src/main/assets/browse_artwork.json /tmp/browse_artwork.json
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          mkdir -p app/src/main/assets
          cp /tmp/browse_artwork.json app/src/main/assets/browse_artwork.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/browse_artwork.json
          git commit -m "Embed Series and Categories artwork [skip ci]"
          git push origin "${{ github.head_ref }}"

      - name: Upload browse artwork bundle
        continue-on-error: true
        if: ${{ steps.capture_art.outputs.captured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-browse-art
          path: browse-art-bundle.json
          if-no-files-found: error
          retention-days: 14

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      # 2.8 starts by measuring the existing lint debt without blocking beta builds. The repository
      # currently has a large set of pre-existing lint findings. Once those are baselined/cleaned,
      # this audit can become a hard gate for new issues.
      - name: Run Android lint audit
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug

      - name: Upload lint report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Test and build debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Summarize UI regression checks
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E,base64
          for path in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              root=E.parse(path).getroot()
              print('TEST_SUMMARY',root.attrib)
              for failure in root.iter('failure'): print((failure.text or '')[:6000])
          image=pathlib.Path('app/build/reports/visual-tests/home-lifecycle.png')
          if image.exists(): print('UI_RENDER_HOME='+base64.b64encode(image.read_bytes()).decode())
          PY

      - name: Upload regression test results
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-tests
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload native screen renders
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-visual-checks
          path: app/build/reports/visual-tests/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CrazyShit-debug.apk

      - name: Upload APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-debug
          path: CrazyShit-debug.apk
          if-no-files-found: error
          retention-days: 14
