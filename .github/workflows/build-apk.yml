name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FEEDBACK_ENDPOINT: ${{ secrets.FEEDBACK_ENDPOINT }}
      FEEDBACK_ANON_KEY: ${{ secrets.FEEDBACK_ANON_KEY }}

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Diagnose current Fapello responses
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import gzip, http.cookiejar, json, re, urllib.error, urllib.parse, urllib.request
          from html.parser import HTMLParser

          BASE = "https://fapello.com/"
          PROFILE = BASE + "sonya-blaze-1/"
          urls = [
              ("home", BASE),
              ("search", BASE + "search_v2/?ajax=1&q=sonya&type=models&limit=8&offset=0"),
              ("old_ajax", BASE + "ajax/model/sonya-blaze-1/page-1/"),
              ("profile", PROFILE),
              ("profile_2", PROFILE + "page-2/"),
          ]
          jar = http.cookiejar.CookieJar()
          opener = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(jar))
          headers = {
              "User-Agent": "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0 Mobile Safari/537.36",
              "Accept-Language": "en-US,en;q=0.9",
              "Accept-Encoding": "gzip",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
              "Referer": BASE,
          }

          class Tags(HTMLParser):
              def __init__(self):
                  super().__init__(); self.rows=[]; self.links=[]
              def handle_starttag(self, tag, attrs):
                  data=dict(attrs)
                  keep={k:v for k,v in data.items() if k in {
                      "href","src","data-src","data-original","data-lazy-src",
                      "srcset","data-url","data-href","poster","type","rel","class"
                  }}
                  if keep and tag in {"a","img","video","source","meta","link","script","div"}:
                      self.rows.append((tag,keep))
                  if tag=="a" and data.get("href"): self.links.append(data["href"])

          def clean_url(value):
              if not value: return value
              value=re.sub(r"/sonya-blaze-1/", "/<creator>/", value)
              value=re.sub(r"(?<=/)[0-9]{4,}(?=/|[.?#]|$)", "<id>", value)
              value=re.sub(r"([_-])[A-Za-z0-9]{12,}(?=[_.?#/]|$)", r"\1<asset>", value)
              return value[:240]

          first_post = None
          for label,url in urls:
              request=urllib.request.Request(url, headers={**headers, "Accept": "application/json,text/javascript,*/*;q=0.8" if label=="search" else "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8", **({"X-Requested-With":"XMLHttpRequest","Origin":"https://fapello.com"} if label=="search" else {})})
              try:
                  response=opener.open(request,timeout=25); status=response.status
              except urllib.error.HTTPError as error:
                  response=error; status=error.code
              raw=response.read()
              if response.headers.get("content-encoding")=="gzip": raw=gzip.decompress(raw)
              text=raw.decode("utf-8","replace")
              print("FAPELLO_PROBE",label,"status",status,"final",clean_url(response.geturl()),"type",response.headers.get("content-type"),"bytes",len(raw),"server",response.headers.get("server"),"cf",bool(response.headers.get("cf-ray")),"cookies",[c.name for c in jar])
              print("FAPELLO_PREFIX",label,repr(re.sub(r"\s+"," ",text[:240])))
              if label=="search":
                  try:
                      value=json.loads(text)
                      print("FAPELLO_JSON",type(value).__name__,list(value)[:20] if isinstance(value,dict) else "items="+str(len(value)))
                      if isinstance(value,dict):
                          result=value.get("results")
                          print("FAPELLO_RESULTS",type(result).__name__,list(result)[:20] if isinstance(result,dict) else "items="+str(len(result or [])))
                  except Exception as error: print("FAPELLO_JSON_ERROR",type(error).__name__)
              parser=Tags(); parser.feed(text)
              relevant=[]
              for tag,attrs in parser.rows:
                  packed=" ".join(str(v) for v in attrs.values())
                  if re.search(r"(load\.svg|/content/|/video/|/ajax/model/|page-|poster|\.mp4|\.webm|\.m3u8|data-)",packed,re.I):
                      relevant.append((tag,{k:clean_url(v) for k,v in attrs.items()}))
              print("FAPELLO_TAGS",label,json.dumps(relevant[:30],ensure_ascii=False))
              if label.startswith("profile") and first_post is None:
                  for href in parser.links:
                      absolute=urllib.parse.urljoin(url,href)
                      if re.search(r"https://(?:[^/]+\.)?fapello\.com/(?:video/(?:new|week)/[0-9]+|[^/]+/[0-9]+)/?$",absolute,re.I):
                          first_post=absolute; break

          if first_post:
              request=urllib.request.Request(first_post,headers={**headers,"Referer":PROFILE,"Accept":"text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"})
              response=opener.open(request,timeout=25); raw=response.read()
              if response.headers.get("content-encoding")=="gzip": raw=gzip.decompress(raw)
              text=raw.decode("utf-8","replace"); parser=Tags(); parser.feed(text)
              relevant=[(tag,{k:clean_url(v) for k,v in attrs.items()}) for tag,attrs in parser.rows if re.search(r"(og:video|content|poster|\.mp4|\.webm|\.m3u8|data-)",json.dumps(attrs),re.I)]
              print("FAPELLO_POST status",response.status,"url",clean_url(response.geturl()),"type",response.headers.get("content-type"),"bytes",len(raw))
              print("FAPELLO_POST_TAGS",json.dumps(relevant[:40],ensure_ascii=False))
          else:
              print("FAPELLO_POST none")
          PY

      - name: Verify 2.8 compatibility cleanup
        run: |
          set -euo pipefail
          if grep -R -n -E 'PAGE_TRENDING|PAGE_MEMES|NAV_TRENDING|NAV_MEMES|ChaosPortraitPolish|SeriesCategoriesNavController|VideoDetailControllerPolish|VideoDetailImmersivePolish' app/src/main/java; then
            echo "Obsolete 2.7 compatibility plumbing was reintroduced."
            exit 1
          fi
          grep -q 'NAV_SERIES = 2' app/src/main/java/com/webapp/crazyshit/NativeMainActivity.java
          grep -q 'NAV_CATEGORIES = 3' app/src/main/java/com/webapp/crazyshit/NativeMainActivity.java
          grep -q 'NativeContentItem.KIND_MEDIA.equals(item.kind)' app/src/main/java/com/webapp/crazyshit/ChaosFeedView.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Capture current Series and Categories artwork
        id: capture_art
        if: ${{ hashFiles('app/src/main/assets/browse_artwork.json') == '' }}
        run: |
          python3 -m pip install --quiet selenium pillow requests
          python3 tools/capture_browse_art.py
          mkdir -p app/src/main/assets
          python3 - <<'PY'
          import base64, io, json
          from PIL import Image, ImageOps

          with open('browse-art-bundle.json', 'r', encoding='utf-8') as f:
              bundle = json.load(f)

          mapping = {}
          for item in bundle.get('items', []):
              key = (item.get('key') or '').strip().lower()
              data = item.get('jpeg_base64') or ''
              if not key or not data:
                  continue
              raw = base64.b64decode(data)
              image = Image.open(io.BytesIO(raw)).convert('RGB')
              image = ImageOps.fit(image, (320, 180), method=Image.Resampling.LANCZOS, centering=(0.5, 0.45))
              out = io.BytesIO()
              image.save(out, 'JPEG', quality=68, optimize=True, progressive=True)
              mapping[key] = base64.b64encode(out.getvalue()).decode('ascii')

          with open('app/src/main/assets/browse_artwork.json', 'w', encoding='utf-8') as f:
              json.dump(mapping, f, separators=(',', ':'))
          print(f'Embedded {len(mapping)} browse card images')
          if len(mapping) < 75:
              raise SystemExit(f'Expected at least 75 embedded images, got {len(mapping)}')
          PY
          echo "captured=true" >> "$GITHUB_OUTPUT"

      - name: Save embedded artwork to branch
        if: ${{ steps.capture_art.outputs.captured == 'true' && github.event_name == 'pull_request' }}
        run: |
          cp app/src/main/assets/browse_artwork.json /tmp/browse_artwork.json
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          mkdir -p app/src/main/assets
          cp /tmp/browse_artwork.json app/src/main/assets/browse_artwork.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/browse_artwork.json
          git commit -m "Embed Series and Categories artwork [skip ci]"
          git push origin "${{ github.head_ref }}"

      - name: Upload browse artwork bundle
        continue-on-error: true
        if: ${{ steps.capture_art.outputs.captured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-browse-art
          path: browse-art-bundle.json
          if-no-files-found: error
          retention-days: 14

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      # 2.8 starts by measuring the existing lint debt without blocking beta builds. The repository
      # currently has a large set of pre-existing lint findings. Once those are baselined/cleaned,
      # this audit can become a hard gate for new issues.
      - name: Run Android lint audit
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug

      - name: Upload lint report
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Test and build debug and release APKs
        run: gradle --no-daemon :app:testDebugUnitTest :app:testReleaseUnitTest :app:assembleDebug :app:assembleRelease

      - name: Summarize UI regression checks
        if: always()
        run: |
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E,base64
          for suite in ('testDebugUnitTest', 'testReleaseUnitTest'):
              for path in pathlib.Path('app/build/test-results', suite).glob('TEST-*.xml'):
                  root=E.parse(path).getroot()
                  print('TEST_SUMMARY', suite, root.attrib)
                  for failure in root.iter('failure'): print((failure.text or '')[:6000])
          image=pathlib.Path('app/build/reports/visual-tests/home-lifecycle.png')
          if image.exists(): print('UI_RENDER_HOME='+base64.b64encode(image.read_bytes()).decode())
          PY

      - name: Upload regression test results
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-tests
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/test-results/testReleaseUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload native screen renders
        continue-on-error: true
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-visual-checks
          path: app/build/reports/visual-tests/*.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk CrazyShit-debug.apk
          cp app/build/outputs/apk/release/app-release.apk CrazyShit-3.0-phase1-release.apk

      - name: Upload APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-debug
          path: CrazyShit-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload release APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-3.0-phase1-release
          path: CrazyShit-3.0-phase1-release.apk
          if-no-files-found: error
          retention-days: 14
