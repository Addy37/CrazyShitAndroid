name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Apply one-shot Chaos randomness wiring
        if: ${{ github.event_name == 'pull_request' && hashFiles('.github/chaos-randomness.apply') != '' }}
        run: |
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/webapp/crazyshit/ChaosFeedView.java')
          text = path.read_text(encoding='utf-8')

          old = '    private static final int MAX_RECENT = 180;\n'
          if old not in text:
              print('Chaos randomness wiring already applied; skipping.')
              raise SystemExit(0)
          text = text.replace(old, '    private static final int MAX_RECENT = 500;\n', 1)

          old = '    private static final int MAX_SOURCE_PAGE = 8;\n'
          assert old in text, 'MAX_SOURCE_PAGE marker changed'
          text = text.replace(old, '', 1)

          old = '    private final Random random = new Random();\n'
          assert old in text, 'Random field marker changed'
          text = text.replace(
              old,
              old + '    private final ChaosSourceMixer sourceMixer = new ChaosSourceMixer(repository, random);\n',
              1,
          )

          old = '    private int autoAdvanceFrom = -1;\n    private int sourcePage = 1;\n    private int selectedPosition;\n'
          assert old in text, 'sourcePage field marker changed'
          text = text.replace(
              old,
              '    private int autoAdvanceFrom = -1;\n'
              '    private int consecutiveDryLoads;\n'
              '    private int selectedPosition;\n',
              1,
          )

          refresh_start = text.index('    public void refresh() {')
          refresh_end = text.index('    public void close()', refresh_start)
          new_refresh = '''    public void refresh() {
              pauseAll();
              consecutiveDryLoads = 0;
              sourceMixer.resetDeck();
              poolLoading = false;
              autoAdvancePending = false;
              autoAdvanceFrom = -1;
              streamCache.clear();
              resolving.clear();
              unplayable.clear();
              // Keep sessionUrls so Refresh cannot immediately deal the same clips back again.
              items.clear();
              adapter.notifyDataSetChanged();
              initialProgress.setVisibility(View.VISIBLE);
              empty.setVisibility(View.GONE);
              selectedPosition = 0;
              pager.setCurrentItem(0, false);
              loadMorePool();
          }

          '''
          text = text[:refresh_start] + new_refresh + text[refresh_end:]

          start = text.index('    private void loadMorePool() {')
          end = text.index('    private static boolean isMedia', start)
          new_method = '''    private void loadMorePool() {
              if (poolLoading) return;
              poolLoading = true;

              io.execute(() -> {
                  List<NativeContentItem> mixed;
                  try {
                      mixed = sourceMixer.loadRandomBatch(activity);
                  } catch (Exception ignored) {
                      mixed = Collections.emptyList();
                  }

                  ArrayList<NativeContentItem> fresh = new ArrayList<>();
                  ArrayList<NativeContentItem> recentFallback = new ArrayList<>();
                  for (NativeContentItem item : mixed) {
                      if (!isMedia(item) || hiddenUrls.contains(item.url)) continue;
                      if (recentSet.contains(item.url)) recentFallback.add(item);
                      else fresh.add(item);
                  }
                  Collections.shuffle(fresh, random);
                  Collections.shuffle(recentFallback, random);

                  activity.runOnUiThread(() -> {
                      poolLoading = false;
                      int before = items.size();
                      appendUnique(fresh);

                      int freshAdded = items.size() - before;
                      if (freshAdded == 0) consecutiveDryLoads++;
                      else consecutiveDryLoads = 0;

                      // Previously watched clips stay out of the normal draw. Only recycle them if
                      // several broad random batches in a row genuinely cannot produce fresh media.
                      if (freshAdded < 4 && consecutiveDryLoads >= 3) {
                          appendUnique(recentFallback);
                      }

                      int added = items.size() - before;
                      if (added > 0 && freshAdded == 0) consecutiveDryLoads = 0;

                      if (added > 0) {
                          adapter.notifyItemRangeInserted(before, added);
                          initialProgress.setVisibility(View.GONE);
                          empty.setVisibility(View.GONE);
                          resolveAhead(selectedPosition);
                          if (active && hostResumed) playSelected();
                          tryPendingAutoAdvance();
                      }

                      boolean needsMore = items.size() < 14
                              || (autoAdvancePending && autoAdvanceFrom + 1 >= items.size());
                      if (needsMore && consecutiveDryLoads < 4) {
                          loadMorePool();
                      } else if (items.isEmpty()) {
                          initialProgress.setVisibility(View.GONE);
                          empty.setText("Chaos couldn't find a playable pool right now.\\nPull away and come back to retry.");
                          empty.setVisibility(View.VISIBLE);
                      } else if (autoAdvancePending && autoAdvanceFrom + 1 >= items.size()) {
                          autoAdvancePending = false;
                          autoAdvanceFrom = -1;
                      }
                  });
              });
          }

          '''
          text = text[:start] + new_method + text[end:]
          path.write_text(text, encoding='utf-8')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/webapp/crazyshit/ChaosFeedView.java
          if ! git diff --cached --quiet; then
            git commit -m "Make Chaos broadly random across site sources"
            git push origin "${{ github.head_ref }}"
          fi

      - name: Verify 2.8 compatibility cleanup
        run: |
          set -euo pipefail
          if grep -R -n -E 'PAGE_TRENDING|PAGE_MEMES|NAV_TRENDING|NAV_MEMES|ChaosPortraitPolish|SeriesCategoriesNavController|VideoDetailControllerPolish|VideoDetailImmersivePolish' app/src/main/java; then
            echo "Obsolete 2.7 compatibility plumbing was reintroduced."
            exit 1
          fi
          grep -q 'NAV_SERIES = 2' app/src/main/java/com/webapp/crazyshit/NativeMainActivity.java
          grep -q 'NAV_CATEGORIES = 3' app/src/main/java/com/webapp/crazyshit/NativeMainActivity.java
          grep -q 'NativeContentItem.KIND_MEDIA.equals(item.kind)' app/src/main/java/com/webapp/crazyshit/ChaosFeedView.java

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Capture current Series and Categories artwork
        id: capture_art
        if: ${{ hashFiles('app/src/main/assets/browse_artwork.json') == '' }}
        run: |
          python3 -m pip install --quiet selenium pillow requests
          python3 tools/capture_browse_art.py
          mkdir -p app/src/main/assets
          python3 - <<'PY'
          import base64, io, json
          from PIL import Image, ImageOps

          with open('browse-art-bundle.json', 'r', encoding='utf-8') as f:
              bundle = json.load(f)

          mapping = {}
          for item in bundle.get('items', []):
              key = (item.get('key') or '').strip().lower()
              data = item.get('jpeg_base64') or ''
              if not key or not data:
                  continue
              raw = base64.b64decode(data)
              image = Image.open(io.BytesIO(raw)).convert('RGB')
              image = ImageOps.fit(image, (320, 180), method=Image.Resampling.LANCZOS, centering=(0.5, 0.45))
              out = io.BytesIO()
              image.save(out, 'JPEG', quality=68, optimize=True, progressive=True)
              mapping[key] = base64.b64encode(out.getvalue()).decode('ascii')

          with open('app/src/main/assets/browse_artwork.json', 'w', encoding='utf-8') as f:
              json.dump(mapping, f, separators=(',', ':'))
          print(f'Embedded {len(mapping)} browse card images')
          if len(mapping) < 75:
              raise SystemExit(f'Expected at least 75 embedded images, got {len(mapping)}')
          PY
          echo "captured=true" >> "$GITHUB_OUTPUT"

      - name: Save embedded artwork to branch
        if: ${{ steps.capture_art.outputs.captured == 'true' && github.event_name == 'pull_request' }}
        run: |
          cp app/src/main/assets/browse_artwork.json /tmp/browse_artwork.json
          git fetch origin "${{ github.head_ref }}"
          git checkout -B "${{ github.head_ref }}" "origin/${{ github.head_ref }}"
          mkdir -p app/src/main/assets
          cp /tmp/browse_artwork.json app/src/main/assets/browse_artwork.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/browse_artwork.json
          git commit -m "Embed Series and Categories artwork [skip ci]"
          git push origin "${{ github.head_ref }}"

      - name: Upload browse artwork bundle
        if: ${{ steps.capture_art.outputs.captured == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-browse-art
          path: browse-art-bundle.json
          if-no-files-found: error
          retention-days: 14

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'
          cache-provider: basic

      # 2.8 starts by measuring the existing lint debt without blocking beta builds. The repository
      # currently has a large set of pre-existing lint findings. Once those are baselined/cleaned,
      # this audit can become a hard gate for new issues.
      - name: Run Android lint audit
        continue-on-error: true
        run: gradle --no-daemon :app:lintDebug

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-lint
          path: |
            app/build/reports/lint-results-debug.html
            app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CrazyShit-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CrazyShit-debug
          path: CrazyShit-debug.apk
          if-no-files-found: error
          retention-days: 14
