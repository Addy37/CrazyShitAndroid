name: Apply v2 native feature wiring

on:
  push:
    branches: [ v2-native-app ]
    paths: [ '.v2-native-features-trigger' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v2-native-app
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Wire view modes and comments into native activity
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/webapp/crazyshit/NativeMainActivity.java')
          s = p.read_text()

          old = 'feedAdapter = new NativeFeedAdapter(new NativeFeedAdapter.Listener() {'
          new = 'feedAdapter = new NativeFeedAdapter(this, new NativeFeedAdapter.Listener() {'
          assert old in s
          s = s.replace(old, new, 1)

          old = '''            @Override
            public void onLongPress(NativeContentItem item, View anchor) {
                haptic(anchor);
                showItemMenu(item, anchor);
            }
        });'''
          new = '''            @Override
            public void onLongPress(NativeContentItem item, View anchor) {
                haptic(anchor);
                showItemMenu(item, anchor);
            }

            @Override
            public void onComments(NativeContentItem item) {
                haptic(recycler);
                openComments(item);
            }
        });'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '''                int last = ((LinearLayoutManager) lm).findLastVisibleItemPosition();
                if (last >= Math.max(0, feedAdapter.getItemCount() - 5)) loadFeed(true);'''
          new = '''                int first = ((LinearLayoutManager) lm).findFirstVisibleItemPosition();
                int last = ((LinearLayoutManager) lm).findLastVisibleItemPosition();
                feedAdapter.preloadVisible(first, last);
                if (last >= Math.max(0, feedAdapter.getItemCount() - 5)) loadFeed(true);'''
          assert old in s
          s = s.replace(old, new, 1)

          old = '        recycler.setLayoutManager(new LinearLayoutManager(this));\n        recycler.setAdapter(feedAdapter);'
          new = '        applyFeedLayout();\n        recycler.setAdapter(feedAdapter);'
          assert old in s
          s = s.replace(old, new, 1)

          anchor = '''    private void showItemMenu(NativeContentItem item, View anchor) {'''
          insert = '''    private void openComments(NativeContentItem item) {
        if (item == null || item.url == null || item.url.isEmpty()) return;
        Intent intent = new Intent(this, CommentsActivity.class);
        intent.putExtra(CommentsActivity.EXTRA_PAGE_URL, item.url);
        intent.putExtra(CommentsActivity.EXTRA_TITLE, item.title);
        intent.putExtra(CommentsActivity.EXTRA_COUNT, item.comments);
        startActivity(intent);
    }

    private String viewPreferenceKey() {
        if (screen == Screen.TRENDING) return "native_view_trending";
        if (screen == Screen.CATEGORY) return "native_view_category";
        if (screen == Screen.SEARCH) return "native_view_search";
        return "native_view_home";
    }

    private int currentViewMode() {
        return getSharedPreferences("app_prefs", MODE_PRIVATE)
                .getInt(viewPreferenceKey(), NativeFeedAdapter.VIEW_LARGE);
    }

    private String viewModeLabel(int mode) {
        if (mode == NativeFeedAdapter.VIEW_COMPACT) return "Compact list";
        if (mode == NativeFeedAdapter.VIEW_GRID) return "2-column grid";
        return "Large cards";
    }

    private void applyFeedLayout() {
        int mode = currentViewMode();
        feedAdapter.setViewMode(mode);
        if (mode == NativeFeedAdapter.VIEW_GRID) {
            recycler.setLayoutManager(new GridLayoutManager(this, 2));
        } else {
            recycler.setLayoutManager(new LinearLayoutManager(this));
        }
    }

    private void showViewStyleDialog() {
        if (!isFeedScreen()) {
            Toast.makeText(this, "View styles apply to feeds.", Toast.LENGTH_SHORT).show();
            return;
        }
        String[] choices = {"Large cards", "Compact list", "2-column grid"};
        int selected = currentViewMode();
        AlertDialog dialog = new AlertDialog.Builder(this)
                .setTitle("View style")
                .setSingleChoiceItems(choices, selected, null)
                .setNegativeButton("Cancel", null)
                .setPositiveButton("Apply", null)
                .create();
        dialog.setOnShowListener(d -> dialog.getButton(AlertDialog.BUTTON_POSITIVE).setOnClickListener(v -> {
            int checked = dialog.getListView().getCheckedItemPosition();
            if (checked < 0) checked = NativeFeedAdapter.VIEW_LARGE;
            getSharedPreferences("app_prefs", MODE_PRIVATE)
                    .edit()
                    .putInt(viewPreferenceKey(), checked)
                    .apply();
            applyFeedLayout();
            recycler.setAdapter(feedAdapter);
            dialog.dismiss();
        }));
        dialog.show();
    }

'''
          assert anchor in s
          s = s.replace(anchor, insert + anchor, 1)

          old = '''        addSheetAction(content, "Settings", "Playback, privacy, haptics and app options", () -> {
            startActivity(new Intent(this, SettingsActivity.class));
            sheet.dismiss();
        });'''
          new = '''        if (isFeedScreen()) {
            int mode = currentViewMode();
            addSheetAction(content, "View style", viewModeLabel(mode) + " • change how posts are displayed", () -> {
                sheet.dismiss();
                showViewStyleDialog();
            });
        }
        addSheetAction(content, "Settings", "Playback, privacy, haptics and app options", () -> {
            startActivity(new Intent(this, SettingsActivity.class));
            sheet.dismiss();
        });'''
          assert old in s
          s = s.replace(old, new, 1)

          p.write_text(s)

          m = Path('app/src/main/AndroidManifest.xml')
          x = m.read_text()
          anchor = '''        <activity
            android:name=".SettingsActivity"
            android:exported="false" />'''
          replacement = '''        <activity
            android:name=".CommentsActivity"
            android:enableOnBackInvokedCallback="true"
            android:exported="false" />

        <activity
            android:name=".SettingsActivity"
            android:exported="false" />'''
          assert anchor in x
          x = x.replace(anchor, replacement, 1)
          m.write_text(x)
          PY

      - name: Commit wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/webapp/crazyshit/NativeMainActivity.java app/src/main/AndroidManifest.xml
          git commit -m "Wire native view modes and comments" || exit 0
          git push origin HEAD:v2-native-app
