name: Apply stable notification update

on:
  push:
    branches: [ main ]
    paths:
      - .github/workflows/apply-notification-update.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Apply v2.8.4 notification patch
        run: |
          set -euo pipefail
          git apply --check .github/workflows/notification-update.patch
          git apply .github/workflows/notification-update.patch
          rm .github/workflows/notification-update.patch
          rm .github/workflows/apply-notification-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add polished video and update notifications"
          git push origin HEAD:main
