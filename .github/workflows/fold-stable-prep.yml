name: Fold Stable Prep Source

on:
  pull_request:
    branches:
      - v2-native-app

permissions:
  contents: write

jobs:
  fold:
    if: github.head_ref == 'v2-stable-prep'
    runs-on: ubuntu-latest
    steps:
      - name: Check out stable prep head
        uses: actions/checkout@v6
        with:
          ref: v2-stable-prep
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Materialize all tested beta patches
        run: gradle --no-daemon :app:wireV2Beta20ChaosLandscapeAutoUpdate

      - name: Commit materialized source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
            exit 0
          fi
          git commit -m "Fold tested v2 beta patches into source [skip ci]"
          git push origin HEAD:v2-stable-prep
