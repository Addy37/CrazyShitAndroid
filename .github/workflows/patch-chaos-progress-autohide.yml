name: Apply Chaos progress auto-hide tweak

on:
  push:
    paths:
      - .github/workflows/patch-chaos-progress-autohide.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - name: Patch Chaos progress bar behavior
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/webapp/crazyshit/ChaosFeedView.java')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '        private final Runnable hideControlsRunnable = this::hideControlsNow;\n',
                  '        private final Runnable hideControlsRunnable = this::hideControlsNow;\n'
                  '        private final Runnable hideSeekBarRunnable = this::hideSeekBarNow;\n'
              ),
              (
                  '            seekBar.setProgress(0);\n'
                  '            seekBar.setEnabled(false);\n'
                  '            lower.setAlpha(1f);\n',
                  '            seekBar.setProgress(0);\n'
                  '            seekBar.setEnabled(false);\n'
                  '            seekBar.setAlpha(1f);\n'
                  '            seekBar.setVisibility(View.VISIBLE);\n'
                  '            lower.setAlpha(1f);\n'
              ),
              (
                  '        private void showControls(boolean autoHide) {\n'
                  '            root.removeCallbacks(hideControlsRunnable);\n'
                  '            lower.animate().cancel();\n'
                  '            mute.animate().cancel();\n'
                  '            controlsVisible = true;\n'
                  '            lower.setVisibility(View.VISIBLE);\n'
                  '            mute.setVisibility(View.VISIBLE);\n'
                  '            lower.setAlpha(1f);\n'
                  '            mute.setAlpha(1f);\n'
                  '            if (autoHide && !scrubbing) root.postDelayed(hideControlsRunnable, 2200L);\n'
                  '        }\n',
                  '        private void showControls(boolean autoHide) {\n'
                  '            root.removeCallbacks(hideControlsRunnable);\n'
                  '            root.removeCallbacks(hideSeekBarRunnable);\n'
                  '            lower.animate().cancel();\n'
                  '            mute.animate().cancel();\n'
                  '            seekBar.animate().cancel();\n'
                  '            controlsVisible = true;\n'
                  '            lower.setVisibility(View.VISIBLE);\n'
                  '            mute.setVisibility(View.VISIBLE);\n'
                  '            seekBar.setVisibility(View.VISIBLE);\n'
                  '            lower.setAlpha(1f);\n'
                  '            mute.setAlpha(1f);\n'
                  '            seekBar.setAlpha(1f);\n'
                  '            if (!scrubbing) root.postDelayed(hideSeekBarRunnable, 2200L);\n'
                  '            if (autoHide && !scrubbing) root.postDelayed(hideControlsRunnable, 2200L);\n'
                  '        }\n'
              ),
              (
                  '        private void startProgressUpdates() {\n',
                  '        private void hideSeekBarNow() {\n'
                  '            if (scrubbing) return;\n'
                  '            seekBar.animate().cancel();\n'
                  '            seekBar.animate()\n'
                  '                    .alpha(0f)\n'
                  '                    .setDuration(180L)\n'
                  '                    .withEndAction(() -> {\n'
                  '                        if (!scrubbing) seekBar.setVisibility(View.INVISIBLE);\n'
                  '                    })\n'
                  '                    .start();\n'
                  '        }\n\n'
                  '        private void startProgressUpdates() {\n'
              ),
              (
                  '        void releasePlayer() {\n'
                  '            root.removeCallbacks(hideControlsRunnable);\n'
                  '            stopProgressUpdates();\n',
                  '        void releasePlayer() {\n'
                  '            root.removeCallbacks(hideControlsRunnable);\n'
                  '            root.removeCallbacks(hideSeekBarRunnable);\n'
                  '            stopProgressUpdates();\n'
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit tweak
        run: |
          rm .github/workflows/patch-chaos-progress-autohide.yml
          git config user.name "Addy37"
          git config user.email "92006667+Addy37@users.noreply.github.com"
          git add app/src/main/java/com/webapp/crazyshit/ChaosFeedView.java .github/workflows/patch-chaos-progress-autohide.yml
          git commit -m "Hide Chaos scrub bar after inactivity"
          git push origin HEAD:main
