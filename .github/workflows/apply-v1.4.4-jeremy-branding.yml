name: Apply Jeremy Edition Branding

on:
  push:
    branches: [ v1.4.4-jeremy-edition ]
    paths:
      - V1_4_4_JEREMY_TRIGGER

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.4.4-jeremy-edition

      - name: Apply in-app Jeremy Edition branding
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'app/src/main/java/com/webapp/crazyshit/MainActivity.java': [
                  ('sheetText("CrazyShit Unofficial", 22, Color.WHITE)',
                   'sheetText("CrazyShit Jeremy Edition", 22, Color.WHITE)'),
                  ('sheetText("Quick controls", 13, Color.rgb(165, 165, 174))',
                   'sheetText("Jeremy Edition • Quick controls", 13, Color.rgb(255, 122, 69))'),
                  ('"CrazyShit Unofficial opens CrazyShit.com, which contains adult and graphic material. " +',
                   '"CrazyShit Jeremy Edition opens CrazyShit.com, which contains adult and graphic material. " +'),
              ],
              'app/src/main/java/com/webapp/crazyshit/SettingsActivity.java': [
                  ('footer.setText("CrazyShit Unofficial  •  Community Android wrapper\\nNot affiliated with or endorsed by CrazyShit.com");',
                   'footer.setText("CrazyShit Jeremy Edition\\nJeremy Edition • Community Android wrapper\\nNot affiliated with or endorsed by CrazyShit.com");'),
              ],
              'README.md': [
                  ('# CrazyShit Unofficial for Android', '# CrazyShit Jeremy Edition for Android'),
                  ('- Latest APK asset: `https://github.com/Addy37/CrazyShitAndroid/releases/latest/download/CrazyShit-Unofficial.apk`',
                   '- Latest APK asset: `https://github.com/Addy37/CrazyShitAndroid/releases/latest/download/CrazyShit-Jeremy-Edition.apk`'),
              ],
          }

          for filename, reps in replacements.items():
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              for old, new in reps:
                  if old not in s:
                      raise SystemExit(f'Expected text not found in {filename}: {old}')
                  s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Commit branding patch
        run: |
          git config user.name "Addy37"
          git config user.email "92006667+Addy37@users.noreply.github.com"
          git add app/src/main/java/com/webapp/crazyshit/MainActivity.java \
                  app/src/main/java/com/webapp/crazyshit/SettingsActivity.java \
                  README.md
          git commit -m "Apply Jeremy Edition in-app branding" || exit 0
          git push origin HEAD:v1.4.4-jeremy-edition
