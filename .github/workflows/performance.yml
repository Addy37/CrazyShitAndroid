name: Android Performance Baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "baselineprofile/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/performance.yml"

permissions:
  contents: read

jobs:
  macrobenchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.7"
          cache-provider: basic

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Macrobenchmarks
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disk-size: 4096M
          script: gradle --no-daemon :baselineprofile:connectedCheck

      - name: Upload benchmark measurements and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-baseline
          path: |
            baselineprofile/build/outputs/androidTest-results/**
            baselineprofile/build/outputs/connected_android_test_additional_output/**
          if-no-files-found: warn
          retention-days: 30
