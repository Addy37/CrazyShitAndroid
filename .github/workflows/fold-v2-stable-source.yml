name: Stable Branding Scan

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fold-v2-stable-source.yml

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v2 stable prep
        uses: actions/checkout@v6
        with:
          ref: v2-stable-prep
          fetch-depth: 0

      - name: Scan old branding
        run: |
          {
            echo "Stable branding scan"
            echo "===================="
            echo
            grep -RInE --exclude-dir=.git --exclude=STABLE_BRANDING_SCAN.txt \
              'Jeremy|Unofficial|v2 Test|CrazyShit-Jeremy' . || true
          } > STABLE_BRANDING_SCAN.txt
          cat STABLE_BRANDING_SCAN.txt

      - name: Commit report to stable prep
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add STABLE_BRANDING_SCAN.txt
          git commit -m "Add stable branding scan report" || exit 0
          git push origin HEAD:v2-stable-prep
