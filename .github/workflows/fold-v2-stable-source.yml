name: Fold v2 Stable Source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fold-v2-stable-source.yml

permissions:
  contents: write

jobs:
  fold:
    runs-on: ubuntu-latest
    steps:
      - name: Check out v2 stable prep
        uses: actions/checkout@v6
        with:
          ref: v2-stable-prep
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android API 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Materialize tested v2 beta source
        run: gradle --no-daemon :app:wireV2Beta20ChaosLandscapeAutoUpdate

      - name: Commit materialized source to stable prep
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src
          if git diff --cached --quiet; then
            echo "No generated source changes to commit."
            exit 0
          fi
          git commit -m "Fold tested v2 beta patches into source"
          git push origin HEAD:v2-stable-prep
