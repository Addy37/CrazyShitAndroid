name: Bunkr Advanced Payload Probe

on:
  push:
    branches: [ fix/bunkr-integration ]
    paths:
      - ".github/workflows/bunkr-advanced-probe.yml"

permissions:
  contents: read

jobs:
  advanced:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live advanced album data
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request

          for suffix in ["?advanced=1", "?advanced=1&page=2", "?page=2"]:
              url = "https://bunkr.cr/a/AT2qgyJj" + suffix
              request = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0 Mobile Safari/537.36",
                  "Referer": "https://balbums.st/",
              })
              with urllib.request.urlopen(request, timeout=20) as response:
                  text = response.read(14 * 1024 * 1024).decode("utf-8", "replace")
                  final = response.geturl()
              exact = text.find("window.albumFiles = [")
              loose = re.search(r"window\.albumFiles\s*=", text, re.I)
              print(json.dumps({
                  "suffix": suffix,
                  "final": final,
                  "bytes": len(text),
                  "exact_assignment": exact,
                  "loose_assignment": loose.start() if loose else -1,
                  "the_items": len(re.findall(r"theItem", text)),
                  "file_hrefs": len(re.findall(r"href=[\"'][^\"']+/(?:f|v|i|d)/", text, re.I)),
              }, sort_keys=True))
              position = exact if exact >= 0 else loose.start() if loose else -1
              if position >= 0:
                  snippet = text[position:position + 5000]
                  print("ASSIGNMENT=%s" % json.dumps(snippet))
                  print("KEYS=%s" % json.dumps(sorted(set(re.findall(r"(?:^|[,{])\s*[\"']?([A-Za-z_$][A-Za-z0-9_$]*)[\"']?\s*:", snippet)))))
              item = re.search(r"class=[\"'][^\"']*theItem[^\"']*[\"']", text, re.I)
              if item:
                  print("ITEM_CONTEXT=%s" % json.dumps(text[max(0, item.start() - 300):item.start() + 3500]))
          PY
